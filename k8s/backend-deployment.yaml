apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: meterflow-backend:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:root@mysql:3306/meterflow"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
  selector:
    app: backend
